[project]
name = "data-monitor"
version = "0.4.1"
description = "Dashboard plugin for data evaluation implementing data drift and anomaly detection"
readme = "README.md"
authors = [
    { name = "Mohammed Fellaji", email = "fellajimohammed@gmail.com" },
    { name = "Yu-Lin Huang", email = "yu-lin.huang@uni.lu" },
    { name = "Firas Bayram", email = "firas.bayram@uni.lu" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "joblib>=1.5.3",
    "scikit-learn>=1.8.0",
    "aisc-plugin-interface>=0.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.12",
    "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
# our 0.4.0, built from the AISC repo's shared/plugin-interface by the AISC repo's scripts/vendor-plugin-interface.sh: PyPI's latest, 0.3.0, has no assesses, helpers or connections
aisc-plugin-interface = { path = "vendor/aisc_plugin_interface-0.4.0-py3-none-any.whl" }
