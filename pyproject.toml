[project]
name = "a4s-plugin-data-evaluation"
version = "0.1.1"
description = "A Python plugin for data evaluation implementing data drift and anomaly detection"
readme = "README.md"
authors = [
    { name = "Mohammed Fellaji", email = "fellajimohammed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a4s-plugin-interface",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.12",
    "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
a4s-plugin-interface = { git = "https://github.com/lux-ai-factory/a4s-plugin-interface" }
